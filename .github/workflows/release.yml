# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Publishes one package when its tag is pushed (the monorepo's sync-mirrors.ts --tag does that):
#   referalli-v1.2.3 -> npm "referalli"           react-v1.2.3   -> @referalli/react
#   next-v1.2.3      -> @referalli/next           express-v1.2.3 -> @referalli/express
# Trusted publishing (OIDC) with provenance: configure it on npmjs.com for each package
# (repo Referalli/referalli-js, workflow release.yml, environment "npm"). Until a package
# exists on npm, set the NPM_TOKEN repo secret for its first release; delete it afterwards.
name: Release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@latest
      - name: Resolve the package
        id: pkg
        run: |
          set -euo pipefail
          short="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          dir="packages/$short"
          test -f "$dir/package.json" || { echo "no package for tag $GITHUB_REF_NAME ($dir)"; exit 1; }
          test "$(node -p "require('./$dir/package.json').version")" = "$version" || { echo "$dir/package.json is not $version"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm install --no-audit --no-fund
      - run: npm run build --workspaces --if-present
      - run: npm test --workspace "${{ steps.pkg.outputs.dir }}" --if-present
      - name: Publish
        run: |
          set -euo pipefail
          tag=latest
          case "${{ steps.pkg.outputs.version }}" in *-*) tag=next ;; esac
          npm publish --workspace "${{ steps.pkg.outputs.dir }}" --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
